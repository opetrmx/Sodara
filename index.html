<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="im/favicon-32x32.ico" type="image/x-icon">
  <title>Camfrog Store - Pro & Coin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-top container">
      <div class="logo">Camfrog Store 🛒</div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari Pro, Extreme, Gold, atau Coin...">
        <button id="searchBtn">Cari</button>
      </div>
    </div>
  </header>

  <!-- Kategori -->
  <nav class="kategori container">
    <button class="kat-btn active" data-kategori="semua">Semua</button>
    <button class="kat-btn" data-kategori="pro">Pro</button>
    <button class="kat-btn" data-kategori="coin">Coin</button>
  </nav>

  <!-- Banner -->
  <section class="banner container">
    <div class="banner-content">
      <h1>Camfrog Pro & Coin</h1>
      <p>Nikmati fitur premium Camfrog </p>
      <p>Harga bisa berubah mengikuti Kurs yg berlaku</p>
    </div>
  </section>

  <!-- Daftar Produk -->
  <main class="container">
    <h2 class="judul-section">Produk Pilihan</h2>
    <div id="daftarProduk" class="grid-produk"></div>
  </main>

  <!-- Modal Pemesanan -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" id="closeModal">&times;</span>
      <h3 id="modalNama"></h3>
      <p id="modalHarga" class="harga-besar"></p>
      <p id="modalDeskripsi"></p>
      <a id="modalBeli" class="btn-beli" href="#" target="_blank">Beli Sekarang</a>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 Camfrog Store. Produk resmi dari <a href="https://www.camfrog.com" target="_blank">camfrog.com</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
